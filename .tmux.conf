# Address vim mode switching delay
set -s escape-time 50

# Increase scrollback buffer size
set -g history-limit 50000

# Upgrade $TERM
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Count windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1

# Set default shell to zshell
set-option -g default-shell /bin/zsh

#set-option -sa terminal-features 'xterm-255color:RGB'

# uniquement pour ne pas confondre avec le tmux dans ECS
unbind-key C-x
set-option -g prefix C-b
bind-key C-b send-prefix

set-window-option -g mode-keys vi
bind-key -n 'C-M-c' copy-mode
# navigation
bind-key -T copy-mode-vi 'M-j' send-keys -X page-down
bind-key -T copy-mode-vi 'M-k' send-keys -X page-up
bind-key -T copy-mode-vi 'M-d' send-keys -X halfpage-down
bind-key -T copy-mode-vi 'M-u' send-keys -X halfpage-up
# renumber all windows when any window is closed
set -g renumber-windows on

# Mydn8y's config

## persist cursor to beam shape within tmux when exit nvim
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
## cause we don't want to use mouse except in copy mode
set -g mouse off
# By default, status msg disappears in the blink of an eye (750ms)
set-option -g display-time 2000
## By default, pane number disappears in 1 s
set-option -g display-panes-time 2000
# unbind-key x               # unbind-key “x” from it’s current job of “ask and then close”
# bind-key x kill-pane       # rebind-key it to just “close”
## key combo for killing the entire session - <prefix> + shift + x
bind-key X kill-session
# unbind default split keybind
unbind-key %
unbind-key '"'
# split horizontally while staying in the current directory
bind-key h split-window -h -c "#{pane_current_path}"
bind-key v split-window -v -c "#{pane_current_path}"

set-option -g status-position top

bind-key C-r source-file ~/.tmux.conf
#restart tmux

# stop auto_rename
set -g allow-rename off
## create new panel with name
bind-key c command-prompt -p "window name:" "new-window; rename-window '%%'"

# unbind default window view key
unbind-key x
unbind-key w
bind-key w confirm-before -p "close pane #P? (y/n)" kill-pane
bind-key W choose-tree -Zw

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Seemlessly switch between tmux panel and nvim buffer
set -g @plugin 'christoomey/vim-tmux-navigator'
## For a nice status bar
set -g @plugin 'catppuccin/tmux'
# catppuccin/tmux v2 renamed this to the US spelling; '@catppuccin_flavour'
# sets a variable nothing reads, so a different flavour would silently no-op.
# mocha happens to be v2's default, which is why it looked fine either way.
set -g @catppuccin_flavor 'mocha'
## Battery display
set -g @plugin 'tmux-plugins/tmux-battery'
## Better yank option
set -g @plugin 'tmux-plugins/tmux-yank'

# Transparent background
set -g @catppuccin_status_background 'none'

# The simplest so that it works with VsCode as well
set -g @catppuccin_window_status_style 'custom'
# Hide status session number, give a bit of space
set -g status-left " "
# Just me playing with space
set -g @catppuccin_window_left_separator " "
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " "
# Set all other windows as the given name
set -g @catppuccin_window_text " #{window_name} "
# Emphasize the current window with space
set -ogq @catppuccin_window_current_number " #I "
# Set window name and if pane is zoomed then put a zoom icon
set -g @catppuccin_window_current_text " #{window_name}#{?window_zoomed_flag, ,}"

# Settings for status bar aka the right part
set -g status-right-length 100
# Empty the default status bar then fill in content
set -g status-right ""
# The default catppuccin datetime and battery don't work well with VsCode
# So i had to tweek it a bit
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_mauve}]   %d-%m-%Y  #[bg=#{@thm_bg},fg=#{@thm_teal}]  %H:%M  "
set -ga status-right "#{?#{e|>=:30,#{battery_percentage}},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]},#{#[bg=#{@thm_bg},fg=#{@thm_green}]}}  #{battery_percentage} "

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
