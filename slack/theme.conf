# slack look & feel, applied by install/work/slack.sh
#
# slack stores both of these in your account prefs server-side, so they don't
# come across when you sign in on a fresh machine. keeping them here is what
# makes them reproducible.

# the custom theme string — 4 comma separated hex colors, in this order:
#   system navigation, selected items, presence indication, notifications
# capture it from slack → preferences → themes → custom theme → "Share",
# paste it below, and commit. the install script copies it to the clipboard,
# and "Import" on that same pane takes it back.
SLACK_THEME="#1E1E2E,#CBA6F7,#CBA6F7,#EBA0AC"

# app font size, as slack's zoom level. 0 is the default and each step is one
# cmd+plus / cmd+minus press, so 1 or 2 for larger text, -1 for smaller.
# leave empty to not touch the font size at all.
SLACK_ZOOM=""
